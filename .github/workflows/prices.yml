name: Daily prices

on:
  schedule:
    # Cardmarket publishes its price guide around 01:50 UTC. GitHub often starts scheduled runs hours late (most of
    # all on the hour), so: one run soon after, and one in the morning in case the first is very late or Cardmarket is.
    # (A second run with nothing new rebuilds the same prices.)
    - cron: '17 2 * * *'
    - cron: '43 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test
        run: node --test scripts/build.test.mjs scripts/pokemonJa.test.mjs scripts/pokemonImages.test.mjs scripts/releaseDates.test.mjs scripts/tcgdexPrices.test.mjs scripts/cardmarketExtras.test.mjs scripts/cardmarketMatch.test.mjs
      # The price files live on the "data" branch, one commit replaced at every run (only the latest prices are kept:
      # committing ~6 MB of them on main 2-4 times a day made the repository grow ~40 MB in 9 days). The build reads
      # yesterday's files (kept when a source fails), so they come back first.
      - name: Yesterday's prices
        run: |
          if git fetch -q --depth=1 origin data; then git checkout FETCH_HEAD -- data; else echo "No data branch yet: every part is built afresh"; fi
      - name: Build price files
        run: node scripts/build.mjs
      - name: Publish
        run: |
          git config user.name "collectthemall-prices bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a commit holding only data/, with no parent: the data branch is replaced, not added to
          export GIT_INDEX_FILE="$RUNNER_TEMP/prices-index"
          git add data
          commit=$(git commit-tree "$(git write-tree)" -m "Prices of $(date -u +%F)")
          git push -f origin "$commit:refs/heads/data"
