name: Daily prices

on:
  schedule:
    # Cardmarket publishes its price guide around 01:50 UTC. GitHub often starts scheduled runs hours late (most of
    # all on the hour), so: one run soon after, and one in the morning in case the first is very late or Cardmarket is.
    # (A second run with nothing new rebuilds the same prices.)
    - cron: '17 2 * * *'
    - cron: '43 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test
        run: node --test scripts/build.test.mjs scripts/pokemonJa.test.mjs scripts/pokemonImages.test.mjs scripts/releaseDates.test.mjs scripts/tcgdexPrices.test.mjs scripts/cardmarketExtras.test.mjs
      - name: Build price files
        run: node scripts/build.mjs
      - name: Publish
        run: |
          git config user.name "collectthemall-prices bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Prices of $(date -u +%F)"
          git push
